<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Puzle 15 — Desliza los números</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hud">
      <div class="hud__brand">
        <h1>Puzle <span>15</span></h1>
        <p>Ordena los números del 1 al 15</p>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat__label">Movimientos</span>
          <span class="stat__value" id="moves">0</span>
        </div>
        <div class="stat">
          <span class="stat__label">Tiempo</span>
          <span class="stat__value" id="time">00:00</span>
        </div>
        <div class="stat">
          <span class="stat__label">Récord</span>
          <span class="stat__value" id="best">—</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn--ghost" id="hintBtn" type="button">💡 Pista</button>
        <button class="btn btn--ghost" id="restartBtn" type="button">🔄 Mezclar</button>
      </div>
    </header>

    <section
      class="board"
      id="board"
      role="grid"
      aria-label="Tablero del puzle 15"
      aria-live="polite"
    ></section>

    <footer class="tips">
      <p>Desliza para mover · Toca una ficha al lado del hueco · Toca el hueco para deshacer</p>
    </footer>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__emoji">🎉</div>
      <h2 id="modalTitle">¡Completado!</h2>
      <p class="modal__stats" id="modalStats"></p>
      <p class="modal__best" id="modalBest"></p>
      <div class="modal__buttons">
        <button class="btn btn--primary" id="playAgainBtn" type="button">🔄 Jugar otra vez</button>
        <button class="btn btn--ghost" id="closeModalBtn" type="button">Ver tablero</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="assertive"></div>

  <script src="game.js"></script>
</body>
</html>
